<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Dark background -->
  <rect width="32" height="32" rx="7" fill="#111113"/>
  <!-- Purple border -->
  <rect x="0.5" y="0.5" width="31" height="31" rx="6.5" fill="none" stroke="#9B5CFF" stroke-opacity="0.45" stroke-width="1"/>

  <!-- White keys: C D E (3 keys) -->
  <rect x="4"  y="9" width="7" height="17" rx="1.5" fill="rgba(240,235,255,0.88)"/>
  <rect x="13" y="9" width="7" height="17" rx="1.5" fill="rgba(240,235,255,0.88)"/>
  <rect x="22" y="9" width="6" height="17" rx="1.5" fill="rgba(240,235,255,0.88)"/>

  <!-- Black keys: C# D# — purple accent -->
  <rect x="9"  y="9" width="5" height="11" rx="1" fill="#9B5CFF"/>
  <rect x="18" y="9" width="5" height="11" rx="1" fill="#9B5CFF"/>

  <!-- Highlight sheen on black keys -->
  <rect x="9"  y="9" width="5" height="4" rx="1" fill="white" opacity="0.15"/>
  <rect x="18" y="9" width="5" height="4" rx="1" fill="white" opacity="0.15"/>
</svg>